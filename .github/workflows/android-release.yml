name: Android navigation diagnostic (no release)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navigation-diagnostic
  cancel-in-progress: false
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Build production and original-library reference in debug assets only
        run: |
          npm run build
          npx cap sync android
          npm pack glisse@0.5.0 --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir -p node_modules/.glisse-original
          tar -xzf "$RUNNER_TEMP/glisse-0.5.0.tgz" -C node_modules/.glisse-original --strip-components=1
          node diagnostics/build-reference.mjs
          chmod +x android/gradlew
          android/gradlew --no-daemon -p android :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 12 native touch trace
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: bash diagnostics/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-navigation-trace
          path: android/app/build/reports/
          retention-days: 14
