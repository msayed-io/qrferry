name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

env:
  NODE_VERSION: '22.13.0'
  CAPACITOR_SERVER_URL: 'https://qrferry-phi.vercel.app'

jobs:
  version:
    name: Bump version and tag release
    if: ${{ !contains(github.event.head_commit.message, '[skip android release]') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Bump patch version
        id: version
        run: |
          set -euo pipefail
          npm version patch --no-git-tag-version --allow-same-version
          result="$(node scripts/bump-android-version.mjs)"
          version="$(node -p 'require("./package.json").version')"
          version_code="$(printf '%s' "$result" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).versionCode')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Commit and tag release
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json android/app/build.gradle
          git commit -m "chore: release v${VERSION} [skip android release]"
          git tag -a "v${VERSION}" -m "QRFerry Android v${VERSION}"
          git push origin HEAD:main --follow-tags
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build signed Android release
    needs: version
    runs-on: ubuntu-24.04
    environment: android-release
    permissions:
      contents: write
    steps:
      - name: Check out versioned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify web source and sync Capacitor
        run: |
          set -euo pipefail
          test -s www/index.html
          npx cap sync android
      - name: Materialize signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qrferry-release.keystore"
          test -s "$RUNNER_TEMP/qrferry-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/qrferry-release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/qrferry-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          android/gradlew --no-daemon --stacktrace -p android clean assembleRelease bundleRelease
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
      - name: Verify package metadata
        run: |
          set -euo pipefail
          expected='com.msayed.qrferry'
          actual="$(apkanalyzer manifest application-id android/app/build/outputs/apk/release/app-release.apk)"
          test "$actual" = "$expected"
          sha256sum android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qrferry-android-${{ needs.version.outputs.version }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            --repo "$GITHUB_REPOSITORY" \
            --title "QRFerry Android v${VERSION}" \
            --generate-notes
      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/qrferry-release.keystore"
